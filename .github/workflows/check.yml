name: Check

# The gate the two MariaDB-bound repos run, called by reference:
#   jobs.check.uses: gokayo43/dev-config-mariadb/.github/workflows/check.yml@<sha>
#
# Everything static is dev-config's, unchanged: this workflow calls that one
# rather than restating any of it, so a gate lands here when the pin below moves
# and never because a copy drifted. `database: false` is not a preference —
# dev-config's database job is Postgres, and the MariaDB jobs this repo adds are
# what a consumer gets instead.
on:
  workflow_call:
    inputs:
      # No descriptions here, deliberately. dev-config declares every one of
      # these and says what it does, including the conditions under which it
      # refuses one; a second copy of that prose is a copy that drifts, and
      # `description` is optional on a workflow_call input. The one exception
      # below states what dev-config cannot: a fact about calling this workflow
      # instead of that one.
      build:
        type: boolean
        default: false
      affected:
        type: boolean
        default: false
      compose:
        type: boolean
        default: false
      mutation-lane:
        type: boolean
        default: false
      mutation-floor:
        type: string
        default: ""
      contract-exemptions:
        description: >-
          A consumer of this workflow names `ci-call` among these: dev-config's
          repo contract asks for a job calling its own check.yml at a pinned SHA,
          and a consumer's call into it is one level down, where that gate cannot
          read it.
        type: string
        default: ""
      stack-allowlist:
        type: string
        default: ""
      test-network:
        type: string
        default: ""
      test-suite-evidence:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  static:
    uses: gokayo43/dev-config/.github/workflows/check.yml@602fca2f24341ef9c445b4a6f750e887cf156f37 # v0.50.1
    with:
      build: ${{ inputs.build }}
      affected: ${{ inputs.affected }}
      compose: ${{ inputs.compose }}
      mutation-lane: ${{ inputs['mutation-lane'] }}
      mutation-floor: ${{ inputs['mutation-floor'] }}
      contract-exemptions: ${{ inputs['contract-exemptions'] }}
      stack-allowlist: ${{ inputs['stack-allowlist'] }}
      test-network: ${{ inputs['test-network'] }}
      test-suite-evidence: ${{ inputs['test-suite-evidence'] }}
      # Every other input that workflow declares is neither declared above nor
      # passed on: each is aimed at the Postgres database job or at the app that
      # job boots, and what will answer them here is a MariaDB job of this
      # repo's own. README.md names them; the suite holds that list to what
      # dev-config declares at the pin above.
      database: false
