name: Check

# The gate the two MariaDB-bound repos run, called by reference:
#   jobs.check.uses: gokayo43/dev-config-mariadb/.github/workflows/check.yml@<sha>
#
# Everything static is dev-config's, unchanged: this workflow calls that one
# rather than restating any of it, so a gate lands here when the pin below moves
# and never because a copy drifted. The `database: false` in that call is not a
# preference — dev-config's database job is Postgres, and the MariaDB jobs this
# workflow adds are what a consumer gets instead. This workflow's own `database`
# input turns those on and never reaches that call.
on:
  workflow_call:
    inputs:
      # No descriptions on a pass-through, deliberately. dev-config declares
      # every one of these and says what it does, including the conditions under
      # which it refuses one; a second copy of that prose is a copy that drifts,
      # and `description` is optional on a workflow_call input. The ones that
      # carry one say what dev-config cannot: a fact about calling this workflow
      # instead of that one, or a fact about a job of this repo's own.
      build:
        type: boolean
        default: false
      affected:
        type: boolean
        default: false
      compose:
        type: boolean
        default: false
      mutation-lane:
        type: boolean
        default: false
      mutation-floor:
        type: string
        default: ""
      contract-exemptions:
        description: >-
          A consumer of this workflow names `ci-call` among these: dev-config's
          repo contract asks for a job calling its own check.yml at a pinned SHA,
          and a consumer's call into it is one level down, where that gate cannot
          read it.
        type: string
        default: ""
      stack-allowlist:
        type: string
        default: ""
      test-network:
        type: string
        default: ""
      test-suite-evidence:
        type: string
        default: ""
      database:
        description: >-
          Replay the repo's own migrations onto an empty MariaDB, twice, and
          compare the schema either side. This is a job of this repo's own and
          this input never reaches dev-config's check.yml, whose job of that
          name is Postgres.
        type: boolean
        default: false
      db-gate-evidence:
        type: string
        default: ""
      datetime-allowlist:
        description: >-
          The columns of the migrated database whose value really is a
          wall-clock reading rather than an instant, as `table.column -- why`
          entries, one per line. An input of this repo's own, and the one
          dev-config has no name for at all — docs/gates/db-datetime.md is what
          it waives and why it is spelled this way.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  static:
    uses: gokayo43/dev-config/.github/workflows/check.yml@602fca2f24341ef9c445b4a6f750e887cf156f37 # v0.50.1
    with:
      build: ${{ inputs.build }}
      affected: ${{ inputs.affected }}
      compose: ${{ inputs.compose }}
      mutation-lane: ${{ inputs['mutation-lane'] }}
      mutation-floor: ${{ inputs['mutation-floor'] }}
      contract-exemptions: ${{ inputs['contract-exemptions'] }}
      stack-allowlist: ${{ inputs['stack-allowlist'] }}
      test-network: ${{ inputs['test-network'] }}
      test-suite-evidence: ${{ inputs['test-suite-evidence'] }}
      # A literal, always. Every other value in this call is a caller's input
      # handed on; this one is the workflow's own answer, and the input of the
      # same name above decides a job here rather than that one. README.md names
      # the inputs that reach neither, and the suite holds that list to what
      # dev-config declares at the pin above.
      database: false

  # Every input aimed at a database job is a request that job would otherwise
  # never see, and a gate nobody notices is off is the worst kind — so a call
  # that asks for one without asking for the job is refused rather than ignored.
  #
  # A job rather than a step, because the only other job that always runs here
  # is a `uses:` and a called workflow takes no steps of a caller's. It has no
  # `if:` for the reason dev-config's own guard has none: a condition restating
  # what the body tests is a second statement of one rule, and the half that
  # gets forgotten is the guard. The body is the rule.
  refusals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          DATABASE: ${{ inputs.database }}
          DB_GATE_EVIDENCE: ${{ inputs['db-gate-evidence'] }}
          DATETIME_ALLOWLIST: ${{ inputs['datetime-allowlist'] }}
        shell: bash
        run: |
          set -euo pipefail
          wrong=0
          refuse() {
            echo "::error::$1"
            wrong=1
          }
          if [ "$DATABASE" != true ]; then
            if [ -n "$DB_GATE_EVIDENCE" ]; then
              refuse "db-gate-evidence needs database: true — it names the artifact the replay job uploads, and this call leaves that job off"
            fi
            if [ -n "$DATETIME_ALLOWLIST" ]; then
              refuse "datetime-allowlist needs database: true — it waives columns the replay job's DATETIME step grades, and this call leaves that job off"
            fi
          fi
          exit "$wrong"

  replay:
    if: inputs.database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Empty on every run, which is the one state no developer database is ever
    # in. Pinned by digest for the same reason an action is, with the tag kept
    # inline: that is the form Renovate's docker datasource maintains.
    #
    # 11.4 because that is what the server this gate is written for runs —
    # nfp-elysia's, probed at 11.4.12-MariaDB. The other repo named in README.md
    # runs MySQL 8.0.32 rather than MariaDB at all, which is a lane this
    # workflow does not have and issue #9 is where it is decided; until then a
    # consumer on MySQL is refused by this image rather than quietly graded
    # against another server's idea of a schema.
    #
    # Redis is started with it, unconditionally: a repo whose migrator imports
    # its own environment module gets that module's Redis check on the way in,
    # and an idle container costs a couple of seconds.
    services:
      mariadb:
        image: mariadb:11.4@sha256:4f1d8d202fcf7bcb3902f63af09f9c1a050c2922a89652f22abaec0d4f015e83
        env:
          MARIADB_ROOT_PASSWORD: mariadb
          MARIADB_DATABASE: app
        ports:
          - 3306:3306
        # Over TCP on purpose. The image's entrypoint runs a temporary server
        # with networking off while it initialises, so a socket ping answers
        # while the database the job is about to migrate does not exist yet.
        options: >-
          --health-cmd "mariadb-admin --protocol=tcp -h 127.0.0.1 -uroot -pmariadb ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    # 127.0.0.1 rather than localhost: a MySQL-family client reads that name as
    # an instruction to use a unix socket, and the server is a container.
    env:
      DATABASE_URL: mysql://root:mariadb@127.0.0.1:3306/app
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes, and it installs and runs the repo's own
          # dependencies in the same workspace the token would sit in.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # What the gate steps below are handed, read here and nowhere else,
      # because here is the last moment in this job at which no line of the
      # graded repo's own code has run yet — not its install scripts, not its
      # build, not its migrator. A step takes the ones it needs: the search path
      # goes to the step that resolves a program by name.
      #
      # A step writes $GITHUB_ENV and $GITHUB_PATH and the runner folds both
      # into the environment of every LATER step; a step output cannot be
      # rewritten once set. So a migrator that exports DATABASE_URL would
      # otherwise choose which database the gates grade, and one that prepends a
      # directory of its own would decide what `bun` and `docker` mean — the
      # gate's own code never executing, or its dumps taken by something that
      # was never the server, and the step green either way. None of the three
      # reaches a value captured before it ran. This is the same bar
      # `_lib/annotations.ts` sets against `::stop-commands::` and
      # `db-replay/database.ts` sets against a migrator's stdout: what the gate
      # grades is not the graded repo's to decide.
      - id: pinned
        run: |
          {
            echo "database-url=$DATABASE_URL"
            echo "bun=$(command -v bun)"
            echo "path=$PATH"
          } >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile

      # The same step dev-config's database job runs, and for the same reason: a
      # repo whose migrator is generated — a schema compiled out of TypeScript, a
      # lineage a build writes — has nothing for this job to replay until the
      # build has run. Without it such a repo is refused for declaring no
      # migrations, which is a false answer to the question this gate asks.
      - if: inputs.build
        run: bun run build

      # By full path and SHA rather than `./`: inside a called workflow a
      # relative `uses:` resolves against the CALLER's checkout, where this
      # repo's actions are not. The consequence is that the action and the
      # workflow pinning it are two commits — this repo's release contract, in
      # CLAUDE.md under "Releasing an action".
      #
      # The image is written twice in this file, in the service above and here,
      # because GitHub gives a service image no way to read a value declared
      # anywhere else. tests/wrapper-inputs.test.ts is what holds the two to one
      # digest.
      - uses: gokayo43/dev-config-mariadb/.github/actions/db-replay@726cbd4698c6a74409382ae54dd1e4aad1000e51
        with:
          # renovate: datasource=docker depName=mariadb
          db-image: mariadb:11.4@sha256:4f1d8d202fcf7bcb3902f63af09f9c1a050c2922a89652f22abaec0d4f015e83
          db-gate-evidence: ${{ inputs['db-gate-evidence'] }}
          database-url: ${{ steps.pinned.outputs['database-url'] }}
          bun: ${{ steps.pinned.outputs.bun }}
          path: ${{ steps.pinned.outputs.path }}

      # After the replay and never before it: this gate grades the catalogue the
      # migrations produced, so it needs the schema that step builds rather than
      # one written by hand. Its own pin, because an action and the workflow
      # pinning it are two commits — CLAUDE.md, "Releasing an action".
      - uses: gokayo43/dev-config-mariadb/.github/actions/db-datetime@726cbd4698c6a74409382ae54dd1e4aad1000e51
        with:
          datetime-allowlist: ${{ inputs['datetime-allowlist'] }}
          database-url: ${{ steps.pinned.outputs['database-url'] }}
          bun: ${{ steps.pinned.outputs.bun }}
