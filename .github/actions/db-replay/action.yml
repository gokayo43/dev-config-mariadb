name: MariaDB replay gate
description: >-
  Replays the calling repo's own db:migrate onto the empty MariaDB the caller
  declared, twice, and compares the two schema dumps. DATABASE_URL is read from
  the environment — the caller declares the service, so it owns the URL, and one
  value means no two steps can disagree about which database was migrated.
  docs/gates/db-replay.md is what each half proves and what it cannot catch.

inputs:
  working-directory:
    description: Where the project lives.
    default: .
  db-image:
    description: >-
      The image the calling job runs the MariaDB service from, pinned by digest.
      The dump's client is taken from this same image so that client and server
      are one build rather than two versions that agree today; nothing on a
      runner ships a MariaDB client, and this is the only pin either of them
      needs. Required, and deliberately without a default: a default here would
      be a second place the caller's choice of server is written down.
    required: true
  db-gate-evidence:
    description: >-
      The artifact name for the two schema dumps this gate compared. A matrix
      that runs more than one leg MUST give each its own: an artifact name may
      be claimed once per run, the default below is a constant, and the second
      leg to upload fails on the duplicate. Empty takes that default, so a
      caller can pass this straight through without having to know how "unset"
      is spelled.
    default: ""

runs:
  using: composite
  steps:
    - name: Replay the migrations
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_DB_IMAGE: ${{ inputs['db-image'] }}
        INPUT_FROM_EMPTY: ${{ runner.temp }}/replay-from-empty.schema
        INPUT_REPLAYED: ${{ runner.temp }}/replay-again.schema
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/replay.main.ts"

    # The two dumps, which are deleted with the runner. A run that failed on the
    # comparison is exactly when they are worth having, and a cancelled one has
    # nothing to say.
    #
    # `.schema` rather than `.sql`, for what they are: what the step compared,
    # with each table's AUTO_INCREMENT counter taken out. Feeding one back would
    # build a database whose counters start over.
    - name: Publish the schemas this gate compared
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        # The one place this name is defaulted, so that a caller passing an
        # empty string through is the same as a caller not asking for one.
        name: ${{ inputs['db-gate-evidence'] || 'db-replay-evidence' }}
        path: |
          ${{ runner.temp }}/replay-from-empty.schema
          ${{ runner.temp }}/replay-again.schema
        # The second is written by a step that may not have been reached.
        if-no-files-found: ignore
