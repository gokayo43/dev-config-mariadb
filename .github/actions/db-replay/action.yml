name: Replay gate
description: >-
  Replays the calling repo's own db:migrate onto the empty database the caller
  started, twice, and compares the two schema dumps. The caller declares the
  server, so it owns the URL and hands it in; one value means no two steps can
  disagree about which database was migrated. docs/gates/db-replay.md is what
  each half proves and what it cannot catch.

inputs:
  working-directory:
    description: >-
      Where the project lives, relative to the checkout. The migrator runs
      there; this gate does not, and passes it as an explicit path rather than
      by being run there itself.
    default: .
  database-image:
    description: >-
      The image the calling job started the server from, pinned by digest. The
      dump's client is taken from this same image so that client and server are
      one build rather than two versions that agree today; nothing on a runner
      ships a client for either product, and this is the only pin either of them
      needs. Required, and deliberately without a default: a default here would
      be a second place the caller's choice of server is written down.
    required: true
  database-url:
    description: >-
      The database to migrate into, as the calling job read it before running a
      line of the graded repo's code. An input rather than an inherited
      variable because a step of the graded repo's own can export one for every
      later step to inherit, and the database this gate replays into is not
      that repo's to choose.
    required: true
  bun:
    description: >-
      The absolute path to the interpreter this gate runs under, from the same
      reading. A bare `bun` is resolved through a PATH the graded repo's own
      steps can prepend to, which replaces this gate with a program that exits 0.
    required: true
  path:
    description: >-
      The search path the gate's own tools are found on, from the same reading —
      `docker`, which runs the pinned image the dump's client comes from, and
      the `bun` the project's own migrator is started with. A dump is only the
      server's own rendering while the program that took it is the one this job
      started.
    required: true

# The two dumps this step writes are uploaded by the JOB rather than by this
# action; check.yml's upload step carries the argument and reads the name.
runs:
  using: composite
  steps:
    - name: Replay the migrations
      shell: bash
      # The action's own checkout, never the graded repo's. `bun` reads a
      # top-level `preload` out of a `bunfig.toml` in its working directory
      # (probed: only that directory — no parent is walked, and no global file
      # is read), so a gate running in the graded checkout runs whatever that
      # repo's bunfig names, before a line of the gate. The migrator still runs
      # in the project below, by the path this step hands the gate.
      working-directory: ${{ github.action_path }}
      env:
        INPUT_DATABASE_IMAGE: ${{ inputs['database-image'] }}
        INPUT_FROM_EMPTY: ${{ runner.temp }}/replay-from-empty.schema
        INPUT_REPLAYED: ${{ runner.temp }}/replay-again.schema
        INPUT_BUN: ${{ inputs.bun }}
        # The dump below is `docker`, resolved by name, and the image it runs is
        # where the dump client comes from: pinning the path is what keeps "the
        # schema is the server's own rendering" true, since a forged docker
        # prints whatever it likes and two of its dumps agree with each other.
        PATH: ${{ inputs.path }}
        # `github.workspace` is an expression context rather than a variable, so
        # nothing a step writes reaches it — which is what makes this an
        # explicit path and not the same inheritance the cwd above just gave up.
        INPUT_PROJECT: ${{ github.workspace }}/${{ inputs['working-directory'] }}
        # Declared by this step, which is what makes it this step's: the runner
        # overlays a step's own `env:` over the environment it inherited, so a
        # variable of this name written into $GITHUB_ENV earlier does not reach
        # the gate.
        DATABASE_URL: ${{ inputs['database-url'] }}
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        . "$GITHUB_ACTION_PATH/../_lib/gate.sh"
        gate replay.main.ts
