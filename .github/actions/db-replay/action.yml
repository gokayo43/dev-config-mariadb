name: MariaDB replay gate
description: >-
  Replays the calling repo's own db:migrate onto the empty MariaDB the caller
  declared, twice, and compares the two schema dumps. The caller declares the
  service, so it owns the URL and hands it in; one value means no two steps can
  disagree about which database was migrated. docs/gates/db-replay.md is what
  each half proves and what it cannot catch.

inputs:
  working-directory:
    description: >-
      Where the project lives, relative to the checkout. The migrator runs
      there; this gate does not, and passes it as an explicit path rather than
      by being run there itself.
    default: .
  db-image:
    description: >-
      The image the calling job runs the MariaDB service from, pinned by digest.
      The dump's client is taken from this same image so that client and server
      are one build rather than two versions that agree today; nothing on a
      runner ships a MariaDB client, and this is the only pin either of them
      needs. Required, and deliberately without a default: a default here would
      be a second place the caller's choice of server is written down.
    required: true
  db-gate-evidence:
    description: >-
      The artifact name for the two schema dumps this gate compared. A matrix
      that runs more than one leg MUST give each its own: an artifact name may
      be claimed once per run, the default below is a constant, and the second
      leg to upload fails on the duplicate. Empty takes that default, so a
      caller can pass this straight through without having to know how "unset"
      is spelled.
    default: ""
  database-url:
    description: >-
      The database to migrate into, as the calling job read it before running a
      line of the graded repo's code. An input rather than an inherited
      variable because a step of the graded repo's own can export one for every
      later step to inherit, and the database this gate replays into is not
      that repo's to choose.
    required: true
  bun:
    description: >-
      The absolute path to the interpreter this gate runs under, from the same
      reading. A bare `bun` is resolved through a PATH the graded repo's own
      steps can prepend to, which replaces this gate with a program that exits 0.
    required: true

runs:
  using: composite
  steps:
    - name: Replay the migrations
      shell: bash
      # The action's own checkout, never the graded repo's. `bun` reads a
      # top-level `preload` out of a `bunfig.toml` in its working directory
      # (probed: only that directory — no parent is walked, and no global file
      # is read), so a gate running in the graded checkout runs whatever that
      # repo's bunfig names, before a line of the gate. The migrator still runs
      # in the project below, by the path this step hands the gate.
      working-directory: ${{ github.action_path }}
      env:
        INPUT_DB_IMAGE: ${{ inputs['db-image'] }}
        INPUT_FROM_EMPTY: ${{ runner.temp }}/replay-from-empty.schema
        INPUT_REPLAYED: ${{ runner.temp }}/replay-again.schema
        INPUT_BUN: ${{ inputs.bun }}
        # `github.workspace` is an expression context rather than a variable, so
        # nothing a step writes reaches it — which is what makes this an
        # explicit path and not the same inheritance the cwd above just gave up.
        INPUT_PROJECT: ${{ github.workspace }}/${{ inputs['working-directory'] }}
        # Declared by this step, which is what makes it this step's: the runner
        # overlays a step's own `env:` over the environment it inherited, so a
        # variable of this name written into $GITHUB_ENV earlier does not reach
        # the gate.
        DATABASE_URL: ${{ inputs['database-url'] }}
      run: |
        set -euo pipefail
        # A composite action maps an input nobody passed to the empty string, so
        # `required: true` above is a promise nothing enforces at runtime — and
        # an empty interpreter is `command not found` naming nothing.
        [ -n "$INPUT_BUN" ] || {
          echo "::error::the bun input is empty — the calling job passes the interpreter this gate runs under, read before the graded repo's code could put another one on PATH"
          exit 1
        }
        "$INPUT_BUN" "$GITHUB_ACTION_PATH/replay.main.ts"

    # The two dumps, which are deleted with the runner. A run that failed on the
    # comparison is exactly when they are worth having, and a cancelled one has
    # nothing to say.
    #
    # `.schema` rather than `.sql`, for what they are: what the step compared,
    # with each table's AUTO_INCREMENT counter taken out. Feeding one back would
    # build a database whose counters start over.
    - name: Publish the schemas this gate compared
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        # The one place this name is defaulted, so that a caller passing an
        # empty string through is the same as a caller not asking for one.
        name: ${{ inputs['db-gate-evidence'] || 'db-replay-evidence' }}
        path: |
          ${{ runner.temp }}/replay-from-empty.schema
          ${{ runner.temp }}/replay-again.schema
        # The second is written by a step that may not have been reached.
        if-no-files-found: ignore
