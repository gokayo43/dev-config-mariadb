name: MariaDB serving gate
description: >-
  Boots the calling repo's app against the MariaDB the replay step migrated,
  polls its health route, runs the repo's own probe against it where there is
  one, and ramps it with the route-coverage floor. Every step reads the app from
  one place — the health URL — and the database from the environment the calling
  job owns, so no two of them can disagree about which app or which database
  they are talking about. docs/gates/db-serving.md is what each step proves and
  what the three of them together cannot catch.

inputs:
  working-directory:
    description: Where the project lives.
    default: .
  start-command:
    description: >-
      How to start the app, as shell code. Required, and deliberately without a
      default: the workflow that calls this declares dev-config's default so
      that a consumer writes one call either way, and a default here as well
      would be a second answer to the same question.
    required: true
  health-url:
    description: >-
      What the boot step polls until it answers 200, and the address every step
      after it takes the app from. Required, for the reason start-command is.
    required: true
  probe-command:
    description: >-
      A command of the repo's own, run against the booted app after it answers
      its health route and before the ramp. Runs as shell code, with the app's
      URL in HEALTH_URL. Its stdout is the verdict: every line it writes there
      is one problem, whatever it exits with, since the gate running it cannot
      know what it was asserting.
    default: ""
  probe-timeout:
    description: >-
      How many seconds probe-command gets before it is killed. Empty takes the
      bound probe.ts declares, which is where the number and the argument for it
      live — a bound is what stops a probe that has wedged from spending the
      job's whole budget and taking the ramp's evidence with it. Set it with
      probe-command or not at all.
    default: ""
  capacity-script:
    description: >-
      A k6 script of the repo's own, resolved against the project above. Empty
      runs the ramp shipped beside this action.
    default: ""
  capacity-path:
    description: >-
      Paths to ramp alongside the health route, e.g. /api/things — one per
      line, since an app serves more than one route and the floor below asks
      for all of them.
    default: ""
  route-allowlist:
    description: >-
      Routes the ramp is not expected to reach, as `METHOD /path -- why`
      entries matching the app's own route table, one per line. The reason is
      part of the entry, the price a lint directive pays.
    default: ""

# The evidence these steps leave in the runner is uploaded by the job rather
# than by this action, which is where the replay's two schema dumps are uploaded
# from as well. One job builds one database and runs one app against it, so one
# upload carries the whole of what happened to it — an artifact name may be
# claimed once per run, and two actions each publishing under the caller's one
# name would be the second of them failing on the duplicate.
runs:
  using: composite
  steps:
    # Migrations applying is half of it; the app running against the schema they
    # produced is the other half. Health answers 200 only once the process is up
    # and a query has round-tripped, so a migration set that applies but leaves
    # the app unable to run fails here.
    #
    # SITE_URL and BETTER_AUTH_SECRET are the house server env contract,
    # dummied — a real secret in a workflow is a leaked secret. A repo whose
    # contract needs more than that extends the workflow rather than the call.
    - name: Boot against that database
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_START_COMMAND: ${{ inputs['start-command'] }}
        INPUT_HEALTH_URL: ${{ inputs['health-url'] }}
        INPUT_APP_LOG: ${{ runner.temp }}/server.log
        SITE_URL: http://localhost
        BETTER_AUTH_SECRET: ci-not-a-secret-ci-not-a-secret-ci
        # The app serves a counter endpoint naming every route it has and how
        # many requests each has taken. Set only here: it is an instrument for
        # the coverage floor, not a surface, and no deployment sets it.
        ROUTE_LOG: "true"
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/boot.main.ts"

    # Between the boot and the ramp, which is the only place it can ask what it
    # asks. Health answering 200 says the app starts against this schema; the
    # route floor below says every route was reached. Neither says an answer was
    # correct, and a migration that quietly reinterprets a column passes both —
    # so the repo gets one command here to assert what only it knows.
    #
    # Either input selects it, so that a caller who set only the bound is told
    # so rather than ignored.
    - name: The repo's own probe of the booted app
      if: ${{ inputs['probe-command'] != '' || inputs['probe-timeout'] != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_PROBE_COMMAND: ${{ inputs['probe-command'] }}
        INPUT_PROBE_TIMEOUT: ${{ inputs['probe-timeout'] }}
        INPUT_HEALTH_URL: ${{ inputs['health-url'] }}
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/probe.main.ts"

    # A number, not a latency threshold. On a shared runner a latency bound
    # measures the runner, and a gate that fails on that is one people turn off.
    # The step fails when k6 died, when it breached the one bound that is not
    # the runner's — the share of requests the app refused — and when it
    # produced no measurement to record.
    #
    # k6.sh is sourced rather than run: it leaves the verified binary at $K6,
    # which is the one thing this step cannot fetch for itself from inside Bun.
    - name: Capacity ramp
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_HEALTH_URL: ${{ inputs['health-url'] }}
        INPUT_CAPACITY_PATH: ${{ inputs['capacity-path'] }}
        INPUT_CAPACITY_SCRIPT: ${{ inputs['capacity-script'] }}
        INPUT_ROUTE_LOG_BEFORE: ${{ runner.temp }}/route-log-before.json
        INPUT_ROUTE_LOG_AFTER: ${{ runner.temp }}/route-log-after.json
        INPUT_SUMMARY_FILE: ${{ runner.temp }}/capacity.json
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        . "$GITHUB_ACTION_PATH/k6.sh"
        bun "$GITHUB_ACTION_PATH/ramp.main.ts"

    # The floor, not a realism claim: a route no request reached has never been
    # under load at all, which is the same thing the coverage threshold catches
    # about a module no test imports.
    - name: Every route the ramp reaches
      shell: bash
      env:
        INPUT_ROUTE_LOG_BEFORE: ${{ runner.temp }}/route-log-before.json
        INPUT_ROUTE_LOG_AFTER: ${{ runner.temp }}/route-log-after.json
        INPUT_ROUTE_ALLOWLIST: ${{ inputs['route-allowlist'] }}
      run: |
        set -euo pipefail
        bun "$GITHUB_ACTION_PATH/route-coverage.main.ts"
